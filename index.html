<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== TELA DE LOGIN: DIGITAR NOME ===== -->
    <div id="telaNome" class="tela-login">
        <div class="card-login">
            <div class="logo">💬</div>
            <h1 id="tituloChat">Meu Chat</h1>
            <p class="subtitulo">Entre com o seu nome para começar</p>
            <input type="text" id="inputNome" placeholder="Seu nome..." autocomplete="off">
            <button class="btn-primario" onclick="confirmarNome()">Continuar</button>
            <div id="erroNome" class="erro"></div>
        </div>
    </div>

    <!-- ===== TELA DE LOGIN: CRIAR SENHA ===== -->
    <div id="telaCriarSenha" class="tela-login oculto">
        <div class="card-login">
            <div class="logo">🔒</div>
            <h1>Olá, <span id="nomeCriar"></span>!</h1>
            <p class="subtitulo">Crie uma senha de acesso</p>
            <input type="password" id="inputNovaSenha" placeholder="Nova senha (mín. 4 caracteres)">
            <input type="password" id="inputConfirmarSenha" placeholder="Confirme a senha">
            <button class="btn-primario" onclick="criarSenha()">Criar Conta e Entrar</button>
            <div id="erroCriarSenha" class="erro"></div>
        </div>
    </div>

    <!-- ===== TELA DE LOGIN: DIGITAR SENHA ===== -->
    <div id="telaSenha" class="tela-login oculto">
        <div class="card-login">
            <div class="logo">🔑</div>
            <h1>Bem-vindo de volta, <span id="nomeSenha"></span>!</h1>
            <p class="subtitulo">Digite sua senha para entrar</p>
            <input type="password" id="inputSenha" placeholder="Sua senha...">
            <button class="btn-primario" onclick="confirmarSenha()">Entrar</button>
            <div id="erroSenha" class="erro"></div>
        </div>
    </div>

    <!-- ===== APLICATIVO PRINCIPAL DE CHAT ===== -->
    <div id="appContainer" class="app-container oculto">
        
        <!-- BARRA LATERAL (SIDEBAR) -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="meu-nome" id="meuNome">Utilizador</div>
                <div class="sidebar-actions">
                    <button onclick="abrirCriarCanal()" title="Criar Canal">+</button>
                    <button onclick="abrirAmigos()" title="Amigos">⭐</button>
                    <button onclick="alternarTema()" title="Mudar Tema">🌓</button>
                </div>
            </div>

            <div class="sidebar-secao">Canais / Grupos</div>
            <div id="listaGrupos" class="lista-grupos"></div>

            <div class="sidebar-secao">Utilizadores Online</div>
            <div id="listaOnline" class="lista-online"></div>
        </div>

        <!-- ÁREA CENTRAL DO CHAT -->
        <div class="chat-main">
            <div class="header">
                <div class="header-info">
                    <button id="btnMenu" class="btn-menu" onclick="toggleSidebar()">☰</button>
                    <div class="status-dot"></div>
                    <h2 id="tituloChatHeader">Geral</h2>
                </div>
            </div>

            <!-- MENSAGENS -->
            <div id="mensagens" class="mensagens"></div>

            <!-- FOOTER / INPUT -->
            <div class="footer">
                <label class="btn-icon" title="Enviar Imagem">
                    📷
                    <input type="file" accept="image/*" style="display:none;" onchange="enviarImagem(this)">
                </label>
                <input type="text" id="entrada" placeholder="Digite sua mensagem..." autocomplete="off">
                <button class="btn-enviar" onclick="enviar()">➤</button>
            </div>
        </div>

        <!-- PAINEL DE AMIGOS (MODAL) -->
        <div id="painelAmigos" class="painel-amigos oculto">
            <div class="painel-amigos-header">
                <h3>Amigos Favoritos</h3>
                <button onclick="fecharAmigos()">✕</button>
            </div>
            <div class="add-amigo">
                <input type="text" id="inputAmigo" placeholder="Adicionar amigo pelo nome..." autocomplete="off">
                <button class="btn-primario" onclick="adicionarAmigo()">Adicionar</button>
            </div>
            <div id="listaAmigos" class="lista-amigos"></div>
            <button class="btn-fechar" onclick="fecharAmigos()">Fechar</button>
        </div>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
