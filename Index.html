<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tela de Nome -->
    <div id="telaNome" class="tela">
        <div class="card-login">
            <div class="logo">💬</div>
            <h1 id="tituloChat">Chat</h1>
            <p class="subtitulo">Como quer ser chamado?</p>
            <input type="text" id="inputNome" placeholder="Seu nome" maxlength="20">
            <button class="btn-primario" onclick="confirmarNome()">Continuar</button>
            <p id="erroNome" class="erro"></p>
        </div>
    </div>

    <!-- Tela de Criar Senha -->
    <div id="telaCriarSenha" class="tela oculto">
        <div class="card-login">
            <div class="logo">🔐</div>
            <h1>Criar Senha</h1>
            <p class="subtitulo">Primeiro uso de "<span id="nomeCriar"></span>". Crie uma senha.</p>
            <input type="password" id="inputNovaSenha" placeholder="Nova senha (mín. 4)">
            <input type="password" id="inputConfirmarSenha" placeholder="Confirmar senha">
            <button class="btn-primario" onclick="criarSenha()">Criar e Entrar</button>
            <p id="erroCriarSenha" class="erro"></p>
        </div>
    </div>

    <!-- Tela de Digitar Senha -->
    <div id="telaSenha" class="tela oculto">
        <div class="card-login">
            <div class="logo">🔒</div>
            <h1>Senha</h1>
            <p class="subtitulo">Senha de "<span id="nomeSenha"></span>"</p>
            <input type="password" id="inputSenha" placeholder="Senha" autocomplete="off">
            <button class="btn-primario" onclick="confirmarSenha()">Entrar</button>
            <p id="erroSenha" class="erro"></p>
        </div>
    </div>

    <!-- Tela de Grupos -->
    <div id="telaGrupos" class="tela oculto">
        <div class="card-login">
            <div class="logo">👥</div>
            <h1>Escolha um grupo</h1>
            <p class="subtitulo">Onde quer conversar?</p>
            <div id="listaGrupos" class="lista-grupos"></div>
        </div>
    </div>

    <!-- Tela do Chat -->
    <div id="telaChat" class="tela oculto">
        <header class="header">
            <div class="header-info">
                <span class="status-dot"></span>
                <h2 id="tituloChatHeader">Chat</h2>
            </div>
            <div class="header-acoes">
                <button class="btn-icon" onclick="abrirAmigos()" title="Amigos">👤➕</button>
                <button class="btn-icon" onclick="mudarGrupo()" title="Mudar grupo">👥</button>
                <span id="meuNome" class="meu-nome"></span>
            </div>
        </header>

        <!-- Painel de Amigos -->
        <div id="painelAmigos" class="painel-amigos oculto">
            <div class="painel-conteudo">
                <h3>Meus Amigos</h3>
                <div id="listaAmigos" class="lista-amigos"></div>
                <div class="add-amigo">
                    <input type="text" id="inputAmigo" placeholder="Nome do amigo" maxlength="20">
                    <button class="btn-primario" onclick="adicionarAmigo()">Adicionar</button>
                </div>
                <button class="btn-fechar" onclick="fecharAmigos()">✕ Fechar</button>
            </div>
        </div>

        <main id="mensagens" class="mensagens">
            <div class="msg-sistema" id="placeholder">
                <span>👋</span>
                <p>Bem-vindo! Suas mensagens aparecerão aqui.</p>
            </div>
        </main>

        <footer class="footer">
            <button class="btn-icon" onclick="document.getElementById('fileInput').click()" title="Enviar imagem">📷</button>
            <input type="file" id="fileInput" accept="image/*" onchange="enviarImagem(this)" style="display:none">
            <input type="text" id="entrada" placeholder="Digite sua mensagem..." maxlength="500">
            <button class="btn-primario btn-enviar" onclick="enviar()">➤</button>
        </footer>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
