<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tela de Nome -->
    <div id="telaNome" class="tela">
        <div class="card-login">
            <div class="logo">💬</div>
            <h1 id="tituloChat">Chat</h1>
            <p class="subtitulo">Como quer ser chamado?</p>
            <input type="text" id="inputNome" placeholder="Seu nome" maxlength="20">
            <button class="btn-primario" onclick="confirmarNome()">Continuar</button>
            <p id="erroNome" class="erro"></p>
        </div>
    </div>

    <!-- Tela de Criar Senha -->
    <div id="telaCriarSenha" class="tela oculto">
        <div class="card-login">
            <div class="logo">🔐</div>
            <h1>Criar Senha</h1>
            <p class="subtitulo">Primeiro uso de "<span id="nomeCriar"></span>". Crie uma senha.</p>
            <input type="password" id="inputNovaSenha" placeholder="Nova senha (mín. 4)">
            <input type="password" id="inputConfirmarSenha" placeholder="Confirmar senha">
            <button class="btn-primario" onclick="criarSenha()">Criar e Entrar</button>
            <p id="erroCriarSenha" class="erro"></p>
        </div>
    </div>

    <!-- Tela de Digitar Senha -->
    <div id="telaSenha" class="tela oculto">
        <div class="card-login">
            <div class="logo">🔒</div>
            <h1>Senha</h1>
            <p class="subtitulo">Senha de "<span id="nomeSenha"></span>"</p>
            <input type="password" id="inputSenha" placeholder="Senha" autocomplete="off">
            <button class="btn-primario" onclick="confirmarSenha()">Entrar</button>
            <p id="erroSenha" class="erro"></p>
        </div>
    </div>

    <!-- Tela de Lista de Conversas (Estilo WhatsApp) -->
    <div id="telaGrupos" class="tela oculto">
        <div class="card-login card-conversas">
            <div class="header-conversas">
                <div class="logo">💬</div>
                <h1>Conversas</h1>
            </div>
            <p class="subtitulo">Escolha uma conversa ou crie um grupo</p>

            <div id="listaGrupos" class="lista-grupos"></div>
            
            <button class="btn-primario btn-criar-grupo" onclick="criarNovoGrupo()">+ Novo Grupo Privado</button>
        </div>
    </div>

    <!-- Tela do Chat -->
    <div id="telaChat" class="tela oculto">
        <header class="header">
            <div class="header-info">
                <span class="status-dot"></span>
                <h2 id="tituloChatHeader">Chat</h2>
            </div>
            <div class="header-acoes">
                <button class="btn-icon" onclick="iniciarChamada(true)" title="Chamada de Vídeo">📹</button>
                <button class="btn-icon" onclick="desligarChamada()" title="Desligar Chamada">❌</button>
                <button id="btnGerenciarGrupo" class="btn-icon oculto" onclick="abrirGerenciadorGrupo()" title="Gerenciar Membros (ADM)">⚙️</button>
                <button class="btn-icon" onclick="abrirAmigos()" title="Amigos">👤➕</button>
                <button class="btn-icon" onclick="mudarGrupo()" title="Voltar para Conversas">👥</button>
                <span id="meuNome" class="meu-nome" onclick="alterarNomePerfil()" style="cursor:pointer;" title="Clique para mudar de nome"></span>
                <button class="btn-icon" onclick="excluirMinhaConta()" title="Excluir Conta" style="color:#ff6b6b;">🗑️</button>
            </div>
        </header>

        <!-- Container de Vídeo WebRTC -->
        <div id="containerVideo" class="container-video oculto">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <!-- Painel de ADM do Grupo -->
        <div id="painelGrupo" class="painel-amigos oculto">
            <div class="painel-conteudo">
                <h3>👑 Painel de ADM do Grupo</h3>
                <div id="listaMembrosGrupo" class="lista-amigos"></div>
                <div class="add-amigo">
                    <input type="text" id="inputNovoMembro" placeholder="Nome do usuário">
                    <button class="btn-primario" onclick="adicionarMembro()">Adicionar Membro</button>
                </div>
                <button class="btn-fechar" onclick="fecharGerenciadorGrupo()">✕ Fechar</button>
            </div>
        </div>

        <!-- Painel de Amigos -->
        <div id="painelAmigos" class="painel-amigos oculto">
            <div class="painel-conteudo">
                <h3>Meus Amigos</h3>
                <div id="listaAmigos" class="lista-amigos"></div>
                <div class="add-amigo">
                    <input type="text" id="inputAmigo" placeholder="Nome do amigo" maxlength="20">
                    <button class="btn-primario" onclick="adicionarAmigo()">Adicionar</button>
                </div>
                <button class="btn-fechar" onclick="fecharAmigos()">✕ Fechar</button>
            </div>
        </div>

        <main id="mensagens" class="mensagens">
            <div class="msg-sistema" id="placeholder">
                <span>👋</span>
                <p>Bem-vindo! Suas mensagens aparecerão aqui.</p>
            </div>
        </main>

        <footer class="footer">
            <button class="btn-icon" onclick="document.getElementById('fileInput').click()" title="Enviar imagem">📷</button>
            <input type="file" id="fileInput" accept="image/*" onchange="enviarImagem(this)" style="display:none">
            
            <button class="btn-icon" onmousedown="iniciarGravacaoAudio()" onmouseup="pararGravacaoAudio()" title="Segure para gravar áudio">🎤</button>

            <input type="text" id="entrada" placeholder="Digite sua mensagem..." maxlength="500">
            <button class="btn-primario btn-enviar" onclick="enviar()">➤</button>
        </footer>
    </div>

    <script type="module" src="script.js"></script>
</body>
                  </html>
